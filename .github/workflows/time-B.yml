name: optcd-time-B

on:
- workflow_dispatch

jobs:
  build:

    runs-on:

    - self-hosted
    - optcd
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: 'mvn: go-offline (untimed)'
      run: mvn -B -q dependency:go-offline || true
    - name: 'mvn: Build with Maven'
      run: mvn -nsu -B install -DdisableXmlReport=true
